    "command": "{python}",
    "arguments": ["{skillRoot}/tests/behavior.py"],
    "timeoutSeconds": 60,
    "runOnInstall": true,
    "expect": {"exitCode": 0, "stdoutJsonEquals": {"status": "PASS"}}
  }
}
