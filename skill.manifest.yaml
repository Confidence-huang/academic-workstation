{
  "schemaVersion": 1,
  "name": "academic-workstation",
  "requiredLayers": ["static", "runtime", "behavior"],
  "runtime": {
    "command": "{python}",
    "arguments": ["{skillRoot}/tests/runtime.py"],
    "timeoutSeconds": 30,
